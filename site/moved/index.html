<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>We've moved · First Line Performance</title>
<meta http-equiv="refresh" content="5;url=https://firstlineperform.com/">
<link rel="icon" href="/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --panel: #0c0c0c; --line: #262626; --gold: #d4a32c; --white: #f5f5f5; --muted: #b3b3b3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--white); font-family: "Barlow", system-ui, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
  .card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 36px 28px; text-align: center; }
  img { width: 88px; height: auto; margin-bottom: 14px; }
  .kicker { color: var(--gold); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 10px; }
  h1 { font-family: "Barlow Condensed", "Barlow", sans-serif; font-style: italic; font-weight: 800; font-size: 40px; line-height: 1; margin: 0 0 16px; text-transform: uppercase; }
  p { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 0 12px; }
  a { color: var(--gold); font-weight: 600; text-decoration: none; word-break: break-all; }
  .count { color: var(--white); font-weight: 600; }
  .btn { display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 10px; border: 1.5px solid var(--gold); color: var(--gold); }
</style>
</head>
<body>
<main>
  <div class="card">
    <img src="/logo.png" alt="First Line Performance" width="88" height="89">
    <p class="kicker">First Line Performance</p>
    <h1>We've moved</h1>
    <p>We've moved to <a id="target" href="https://firstlineperform.com/">https://firstlineperform.com</a>. Please use that URL going forward, thank you!</p>
    <p>You will now be redirected there in <span class="count" id="count">5</span> seconds.</p>
    <a class="btn" id="go" href="https://firstlineperform.com/">Take me there now</a>
  </div>
</main>
<script>
  // Same page on the new address: /pricing.html on beta lands on /pricing.html at firstlineperform.com.
  (function () {
    var path = location.pathname === "/index.html" ? "/" : location.pathname;
    var target = "https://firstlineperform.com" + path + location.search + location.hash;
    document.getElementById("target").href = target;
    document.getElementById("go").href = target;
    var left = 5, el = document.getElementById("count");
    var tick = setInterval(function () {
      left -= 1;
      el.textContent = String(Math.max(left, 0));
      if (left <= 0) { clearInterval(tick); location.replace(target); }
    }, 1000);
  })();
</script>
</body>
</html>
